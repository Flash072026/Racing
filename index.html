<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Racing Outlet - Top 20</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen pb-12">

    <header class="bg-slate-800 border-b border-slate-700 py-6 text-center shadow-lg">
        <h1 class="text-3xl font-extrabold tracking-wider text-amber-400 uppercase">?? RACING OUTLET LEADERBOARD ??</h1>
        <p class="text-slate-400 mt-2 text-sm">Data diperbarui otomatis dari Google Sheets • Menampilkan 20 Outlet Teratas</p>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8">
        
        <div id="status-container" class="text-center py-12">
            <div id="loading-spinner" class="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-400 mx-auto"></div>
            <p id="status-text" class="text-slate-400 mt-4">Memuat data real-time...</p>
            <div id="debug-info" class="hidden mt-4 mx-auto max-w-xl p-4 bg-slate-800 border border-red-500/30 rounded-lg text-left text-xs font-mono text-red-300 overflow-x-auto"></div>
        </div>

        <div id="leaderboard-container" class="hidden bg-slate-800 rounded-xl shadow-2xl overflow-hidden border border-slate-700">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-700 text-slate-200 uppercase text-xs tracking-wider">
                        <th class="py-4 px-6 text-center w-20">Rank</th>
                        <th class="py-4 px-6">Nama Outlet</th>
                        <th class="py-4 px-6">ID Outlet</th>
                        <th class="py-4 px-6 text-right">Jumlah Trx</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-700">
                    </tbody>
            </table>
        </div>
    </main>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1MpDK4B8KepYv3IvEMoGj9eTQfti_vPXSJCDoqnSp8Yc/export?format=csv';

        // Fungsi membersihkan spasi & mengubah teks jadi huruf kecil semua
        const cleanKey = (str) => str.toLowerCase().replace(/\s+/g, '').trim();

        function csvToObjects(csvText) {
            const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length === 0) return [];
            
            // Ambil header asli dan versi bersihnya
            const originalHeaders = lines[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(h => h.trim().replace(/^"|"$/g, ''));
            const cleanHeaders = originalHeaders.map(cleanKey);
            
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const currentline = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/^"|"$/g, ''));
                const obj = {};
                
                cleanHeaders.forEach((header, index) => {
                    obj[header] = currentline[index] !== undefined ? currentline[index] : '';
                });
                result.push(obj);
            }
            return { data: result, headers: cleanHeaders, originalHeaders: originalHeaders };
        }

        async function fetchLeaderboardData() {
            const statusText = document.getElementById('status-text');
            const loadingSpinner = document.getElementById('loading-spinner');
            const debugInfo = document.getElementById('debug-info');
            const leaderboardContainer = document.getElementById('leaderboard-container');

            try {
                const response = await fetch(`${SHEET_CSV_URL}&cachebuster=${new Date().getTime()}`);
                if (!response.ok) throw new Error(`HTTP Error! Status: ${response.status}. Pastikan link bisa diakses.`);
                
                const csvText = await response.text();
                
                // Jaga-jaga jika isinya malah halaman login Google (berarti sheet masih privat)
                if (csvText.includes('<!DOCTYPE html>') || csvText.includes('login')) {
                    throw new Error('File terdeteksi privat. Google mengembalikan halaman login, bukan data CSV. Silakan cek ulang bagian "Akses Umum" di Google Sheet Anda.');
                }

                const parsed = csvToObjects(csvText);
                let outlets = parsed.data;

                if (outlets.length === 0) {
                    throw new Error('Google Sheet terbaca, tetapi tidak ada baris data di dalamnya.');
                }

                // Cek ketersediaan kolom wajib (Nama Outlet, ID Outlet, Jumlah Trx)
                const targetNama = cleanKey('Nama Outlet');
                const targetId = cleanKey('Id Outlet');
                const targetTrx = cleanKey('Jumlah Trx');

                if (!parsed.headers.includes(targetNama) || !parsed.headers.includes(targetId) || !parsed.headers.includes(targetTrx)) {
                    throw new Error(`KOLOM TIDAK COCOK!\nKolom yang dibutuhkan: [Nama Outlet], [Id Outlet], [Jumlah Trx]\nKolom yang terdeteksi di Sheet Anda: [${parsed.originalHeaders.join(', ')}]\n\nSilakan samakan nama judul kolom di baris pertama Google Sheet Anda.`);
                }

                // Urutkan berdasarkan Transaksi Terbesar
                outlets.sort((a, b) => {
                    const trxA = parseInt(String(a[targetTrx]).replace(/[^0-9]/g, '')) || 0;
                    const trxB = parseInt(String(b[targetTrx]).replace(/[^0-9]/g, '')) || 0;
                    return trxB - trxA;
                });

                const top20Outlets = outlets.slice(0, 20);
                const tableBody = document.getElementById('table-body');
                tableBody.innerHTML = ''; 

                top20Outlets.forEach((outlet, index) => {
                    const rank = index + 1;
                    let rankBadge = `<span class="font-bold text-slate-400">${rank}</span>`;
                    let rowBg = "hover:bg-slate-750/50 transition-colors";
                    
                    if (rank === 1) {
                        rankBadge = `<span class="bg-amber-500 text-slate-950 px-2.5 py-1 rounded-full font-black animate-pulse">?? 1</span>`;
                        rowBg = "bg-amber-500/10 hover:bg-amber-500/20 font-semibold border-amber-500/30";
                    } else if (rank === 2) {
                        rankBadge = `<span class="bg-slate-300 text-slate-950 px-2.5 py-1 rounded-full font-black">?? 2</span>`;
                    } else if (rank === 3) {
                        rankBadge = `<span class="bg-amber-700 text-white px-2.5 py-1 rounded-full font-black">?? 3</span>`;
                    }

                    const rawTrx = parseInt(String(outlet[targetTrx]).replace(/[^0-9]/g, '')) || 0;

                    const row = `
                        <tr class="${rowBg}">
                            <td class="py-4 px-6 text-center">${rankBadge}</td>
                            <td class="py-4 px-6 font-medium text-white">${outlet[targetNama] || '-'}</td>
                            <td class="py-4 px-6 text-slate-400 font-mono">${outlet[targetId] || '-'}</td>
                            <td class="py-4 px-6 text-right text-emerald-400 font-bold">${rawTrx.toLocaleString('id-ID')} Trx</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });

                // Sembunyikan status loading, tampilkan tabel
                document.getElementById('status-container').classList.add('hidden');
                leaderboardContainer.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                loadingSpinner.classList.add('hidden');
                leaderboardContainer.classList.add('hidden');
                document.getElementById('status-container').classList.remove('hidden');
                
                statusText.innerHTML = `<span class="text-red-400 font-bold text-lg">?? Gagal Memuat Data</span>`;
                debugInfo.classList.remove('hidden');
                debugInfo.innerText = `Log Error:\n${error.message}`;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchLeaderboardData);
        setInterval(fetchLeaderboardData, 60000);
    </script>
</body>
</html>
