<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Racing Outlet - Top 20 & Pencarian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen pb-12">

    <header class="bg-slate-800 border-b border-slate-700 py-6 text-center shadow-lg">
        <h1 class="text-3xl font-extrabold tracking-wider text-amber-400 uppercase">🏆 RACING OUTLET LEADERBOARD 🏆</h1>
        <p class="text-slate-400 mt-2 text-sm">Data diperbarui • Menampilkan 20 Outlet Teratas</p>
        <p id="last-update" class="text-emerald-400 mt-1 text-xs font-semibold flex justify-center items-center gap-1">
            🕒 Menghubungkan ke server...
        </p>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8">
        
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl mb-8">
            <h2 class="text-lg font-bold text-amber-400 mb-3 flex items-center gap-2">🔍 Cek Peringkat Outlet Anda</h2>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="search-input" placeholder="Masukkan ID Outlet Anda (cth: ok0001)" 
                    class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 font-mono tracking-wider uppercase">
                <button onclick="searchOutlet()" 
                    class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-6 py-3 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-md">
                    Cari Peringkat
                </button>
            </div>
            
            <div id="search-result-container" class="hidden mt-6 p-5 bg-slate-950/60 border border-slate-700 rounded-lg animate-fade-in">
                </div>
        </div>

        <div id="status-container" class="text-center py-12">
            <div id="loading-spinner" class="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-400 mx-auto"></div>
            <p id="status-text" class="text-slate-400 mt-4">Memuat data real-time...</p>
            <div id="debug-info" class="hidden mt-4 mx-auto max-w-xl p-4 bg-slate-800 border border-red-500/30 rounded-lg text-left text-xs font-mono text-red-300 overflow-x-auto"></div>
        </div>

        <div id="leaderboard-container" class="hidden bg-slate-800 rounded-xl shadow-2xl overflow-hidden border border-slate-700">
            <div class="p-4 bg-slate-750 border-b border-slate-700 font-bold text-sm tracking-wide text-slate-300 uppercase">
                🔥 TOP 20 OUTLET TERATAS
            </div>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-700 text-slate-200 uppercase text-xs tracking-wider">
                        <th class="py-4 px-6 text-center w-20">Rank</th>
                        <th class="py-4 px-6">Nama Outlet</th>
                        <th class="py-4 px-6">ID Outlet</th>
                        <th class="py-4 px-6 text-right">Jumlah Trx</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-700">
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1MpDK4B8KepYv3IvEMoGj9eTQfti_vPXSJCDoqnSp8Yc/export?format=csv';
        const cleanKey = (str) => str.toLowerCase().replace(/\s+/g, '').trim();

        // Variabel global untuk menyimpan data seluruh outlet setelah di-fetch
        let globalAllOutlets = []; 
        let targetNama = '';
        let targetId = '';
        let targetTrx = '';

        function csvToObjects(csvText) {
            const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length === 0) return [];
            const originalHeaders = lines[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(h => h.trim().replace(/^"|"$/g, ''));
            const cleanHeaders = originalHeaders.map(cleanKey);
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const currentline = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/^"|"$/g, ''));
                const obj = {};
                cleanHeaders.forEach((header, index) => {
                    obj[header] = currentline[index] !== undefined ? currentline[index] : '';
                });
                result.push(obj);
            }
            return { data: result, headers: cleanHeaders, originalHeaders: originalHeaders };
        }

        // Format Sensor ID (Contoh: ok**01)
        function maskIdOutlet(idStr) {
            if (!idStr) return '-';
            const str = String(idStr).trim();
            if (str.length >= 6) {
                const startPart = str.slice(0, 2);
                const endPart = str.slice(-2);
                return startPart + '**' + endPart;
            }
            if (str.length <= 2) return str;
            return str.slice(0, 1) + '**' + str.slice(-1);
        }

        function updateTimestamp() {
            const now = new Date();
            const options = { 
                year: 'numeric', month: 'long', day: 'numeric', 
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                timeZoneName: 'short'
            };
            document.getElementById('last-update').innerHTML = `🕒 Terakhir Diperbarui: ${now.toLocaleDateString('id-ID', options)}`;
        }

        async function fetchLeaderboardData() {
            try {
                const response = await fetch(`${SHEET_CSV_URL}&cachebuster=${new Date().getTime()}`);
                const csvText = await response.text();
                const parsed = csvToObjects(csvText);
                
                globalAllOutlets = parsed.data;
                targetNama = cleanKey('Nama Outlet');
                targetId = cleanKey('Id Outlet');
                targetTrx = cleanKey('Jumlah Trx');

                // Urutkan SELURUH data berdasarkan Transaksi Terbesar
                globalAllOutlets.sort((a, b) => {
                    const trxA = parseInt(String(a[targetTrx]).replace(/[^0-9]/g, '')) || 0;
                    const trxB = parseInt(String(b[targetTrx]).replace(/[^0-9]/g, '')) || 0;
                    return trxB - trxA;
                });

                const tableBody = document.getElementById('table-body');
                tableBody.innerHTML = ''; 

                // Tampilkan hanya TOP 20 di tabel utama
                globalAllOutlets.slice(0, 20).forEach((outlet, index) => {
                    const rank = index + 1;
                    let rankBadge = `<span class="font-bold text-slate-400">${rank}</span>`;
                    let rowBg = "hover:bg-slate-750/50 transition-colors";
                    
                    if (rank === 1) rankBadge = `<span class="bg-amber-500 text-slate-950 px-2.5 py-1 rounded-full font-black animate-pulse">🥇 1</span>`;
                    else if (rank === 2) rankBadge = `<span class="bg-slate-300 text-slate-950 px-2.5 py-1 rounded-full font-black">🥈 2</span>`;
                    else if (rank === 3) rankBadge = `<span class="bg-amber-700 text-white px-2.5 py-1 rounded-full font-black">🥉 3</span>`;

                    const rawTrx = parseInt(String(outlet[targetTrx]).replace(/[^0-9]/g, '')) || 0;
                    const maskedId = maskIdOutlet(outlet[targetId]);

                    tableBody.innerHTML += `
                        <tr class="${rowBg}">
                            <td class="py-4 px-6 text-center">${rankBadge}</td>
                            <td class="py-4 px-6 font-medium text-white">${outlet[targetNama] || '-'}</td>
                            <td class="py-4 px-6 text-slate-400 font-mono">${maskedId}</td>
                            <td class="py-4 px-6 text-right text-emerald-400 font-bold">${rawTrx.toLocaleString('id-ID')} Trx</td>
                        </tr>`;
                });
                
                document.getElementById('status-container').classList.add('hidden');
                document.getElementById('leaderboard-container').classList.remove('hidden');
                updateTimestamp();

                // Jika user sebelumnya sudah mencari data, refresh juga hasil pencariannya
                const currentSearch = document.getElementById('search-input').value;
                if (currentSearch.trim() !== "") {
                    searchOutlet(true); // silent refresh tanpa memicu scroll/alert
                }

            } catch (error) {
                document.getElementById('status-text').innerHTML = `<span class="text-red-400 font-bold text-lg">⚠️ Gagal Memuat Data</span>`;
                document.getElementById('debug-info').classList.remove('hidden');
                document.getElementById('debug-info').innerText = `Log Error:\n${error.message}`;
            }
        }

        // FUNGSI UNTUK MENCARI ID OUTLET SECARA DINAMIS
        function searchOutlet(isSilent = false) {
            const inputVal = document.getElementById('search-input').value.trim().toLowerCase();
            const resultContainer = document.getElementById('search-result-container');

            if (!inputVal) {
                if (!isSilent) alert("Silakan masukkan ID Outlet terlebih dahulu!");
                return;
            }

            if (globalAllOutlets.length === 0) {
                if (!isSilent) alert("Data belum siap atau gagal dimuat dari server.");
                return;
            }

            // Cari index / posisi outlet di dalam array yang sudah terurut
            const totalOutlet = globalAllOutlets.length;
            const foundIndex = globalAllOutlets.findIndex(item => String(item[targetId]).toLowerCase().trim() === inputVal);

            resultContainer.classList.remove('hidden');

            if (foundIndex !== -1) {
                const outletData = globalAllOutlets[foundIndex];
                const rankPosisi = foundIndex + 1;
                const rawTrx = parseInt(String(outletData[targetTrx]).replace(/[^0-9]/g, '')) || 0;
                const maskedId = maskIdOutlet(outletData[targetId]);

                // Desain box hasil pencarian jika ID ditemukan
                resultContainer.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Hasil Pencarian:</div>
                            <div class="text-xl font-bold text-white mt-1">${outletData[targetNama]}</div>
                            <div class="text-sm font-mono text-slate-400 mt-0.5">ID Outlet: ${maskedId} | ${rawTrx.toLocaleString('id-ID')} Trx</div>
                        </div>
                        <div class="bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 px-5 py-3 rounded-xl text-center self-stretch md:self-auto flex flex-col justify-center shadow-lg">
                            <span class="text-xs font-black uppercase tracking-widest opacity-80">Peringkat Anda</span>
                            <span class="text-2xl font-black">Rank ${rankPosisi}</span>
                            <span class="text-xs font-bold opacity-90">dari ${totalOutlet.toLocaleString('id-ID')} Outlet</span>
                        </div>
                    </div>
                `;
            } else {
                // Jendela informasi jika ID tidak ditemukan
                resultContainer.innerHTML = `
                    <div class="text-center py-2 text-red-400 font-semibold flex items-center justify-center gap-2">
                        ❌ ID Outlet "${inputVal.toUpperCase()}" tidak ditemukan dalam database racing.
                    </div>
                `;
            }
        }

        // Trigger pencarian juga bisa menggunakan tombol 'Enter' pada keyboard
        document.getElementById('search-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchOutlet();
            }
        });

        document.addEventListener('DOMContentLoaded', fetchLeaderboardData);
        setInterval(fetchLeaderboardData, 60000); // Sinkronisasi otomatis data per 1 menit
    </script>
</body>
</html>
